<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TexCheck</title>
  <meta name="description" content="Optimiza la producción textil con flujos de mantenimiento inteligentes y monitoreo de equipos en tiempo real." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles/styles.css" />
</head>
<body>
  <!-- ───────── HEADER ───────── -->
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="#top" class="brand" aria-label="TexCheck home">
        <img 
          src="assets/images/TexCheck.png" 
          alt="TexCheck Logo" 
          class="brand-logo"
          width="120"
        />
      </a>

      <nav class="desktop-nav" aria-label="Navegación principal">
        <a href="#solution"  data-i18n="nav.solution">Solución</a>
        <a href="#features"  data-i18n="nav.features">Funciones</a>
        <a href="#about"     data-i18n="nav.about">Nosotros</a>
        <a href="#dev-team"  data-i18n="nav.team">Equipo</a>
        <a href="#contact"   data-i18n="nav.contact">Contacto</a>
      </nav>

      <div class="nav-actions desktop-actions">
        <!-- Locale switcher -->
        <div class="locale-switcher" aria-label="Language switcher">
          <button class="locale-btn" data-locale-btn="es" aria-pressed="true">ES</button>
          <span class="locale-sep">|</span>
          <button class="locale-btn" data-locale-btn="en" aria-pressed="false">EN</button>
        </div>
        <button class="login-link" id="openLoginBtn" data-i18n="nav.login">Iniciar sesión</button>
        <a href="#contact" class="btn btn-dark" data-i18n="nav.demo">Solicitar demo</a>
      </div>

      <div class="mobile-actions">
        <div class="locale-switcher locale-switcher-sm" aria-label="Language switcher">
          <button class="locale-btn" data-locale-btn="es" aria-pressed="true">ES</button>
          <span class="locale-sep">|</span>
          <button class="locale-btn" data-locale-btn="en" aria-pressed="false">EN</button>
        </div>
        <a href="#contact" class="btn btn-dark btn-mobile-demo" data-i18n="nav.demo">Solicitar demo</a>
        <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mobileMenu" aria-label="Abrir menú">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
      <nav aria-label="Navegación móvil">
        <a href="#features" class="mobile-link" data-i18n="nav.features">Funciones</a>
        <a href="#solution" class="mobile-link" data-i18n="nav.solution">Solución</a>
        <a href="#about"    class="mobile-link" data-i18n="nav.about">Nosotros</a>
        <a href="#dev-team" class="mobile-link" data-i18n="nav.team">Equipo</a>
        <a href="#contact"  class="mobile-link" data-i18n="nav.contact">Contacto</a>
        <button class="mobile-link mobile-login-btn" id="openLoginBtnMobile" data-i18n="nav.login">Iniciar sesión</button>
      </nav>
    </div>
  </header>
</html>
